# ROLE: Provide the two required exact-head implementation checks on pull requests and main.
# BOUNDARY: The workflow proves candidate behavior; guarded merge and completion are owned by .harness/validation.md.
# RELATIONS: scripts/production-smoke.mjs owns the reusable production-build smoke contract.
# VALIDATION: repository-security.mjs enforces immutable actions, frozen installs, least privilege, and checkout history depth.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: CI / baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 3
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enable pnpm 11.18.0
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run baseline
        run: pnpm validate

  browser-smoke:
    name: CI / browser-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enable pnpm 11.18.0
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run self-contained production smoke
        run: pnpm test:smoke
      - name: Run Chromium against the reusable build
        run: pnpm test:e2e
