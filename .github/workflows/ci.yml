# MODULE: .github/workflows/ci.yml
# PURPOSE: Provide the two exact foundation checks on pull requests to and pushes on main.
# PUBLIC API / ENTRYPOINTS:
#   - CI / baseline: runs the complete local baseline contract.
#   - CI / browser-smoke: proves production startup and Chromium behavior from one build.
# INVARIANTS:
#   - Every remote action is immutable, jobs use frozen installs, and superseded commits cancel deterministically.
# RELATED:
#   - .harness/validation.md: owns delivery commands and required check procedures.
#   - scripts/production-smoke.mjs: owns the single-build smoke contract.
# SECURITY:
#   - Workflow permission is contents read and no workflow secret is consumed.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: CI / baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enable pnpm 11.18.0
        run: corepack install --global pnpm@11.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run baseline
        run: pnpm validate

  browser-smoke:
    name: CI / browser-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enable pnpm 11.18.0
        run: corepack install --global pnpm@11.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run self-contained production smoke
        run: pnpm test:smoke
      - name: Run Chromium against the reusable build
        run: pnpm test:e2e
